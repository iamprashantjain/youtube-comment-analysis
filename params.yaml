base:
  target_col: 'category'

data_ingestion:
  data_url: "https://raw.githubusercontent.com/Himanshu-1703/reddit-sentiment-analysis/refs/heads/main/data/reddit.csv"
  test_size: 0.2
  random_state: 42

data_preprocessing:
  text_column: "clean_comment"

model_trainer:
  ngram_range: [1, 3]
  max_features: 10000
  learning_rate: 0.088
  max_depth: 15
  n_estimators: 664


mlflow:
  username: iamprashantjain
  experiment_name: youtube-comment-analysis
  repo: iamprashantjain/youtube-comment-analysis.mlflow