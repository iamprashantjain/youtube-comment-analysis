stages:
  data_ingestion:
    cmd: python src/components/data_ingestion.py
    deps:
      - src/components/data_ingestion.py
      - params.yaml
    outs:
      - artifacts/data_ingestion/raw.csv
      - artifacts/data_ingestion/train.csv
      - artifacts/data_ingestion/test.csv


  data_preprocessing:
    cmd: python src/components/data_preprocessing.py
    deps:
      - src/components/data_preprocessing.py
      - params.yaml
    outs:
      - artifacts/data_preprocessing/train_processed.csv
      - artifacts/data_preprocessing/test_processed.csv


  model_trainer:
    cmd: python src/components/model_trainer.py
    deps:
      - src/components/model_trainer.py
      - params.yaml
    outs:
      - artifacts/model_trainer/tfidf_vectorizer.pkl
      - artifacts/model_trainer/lgbm_model.pkl
    

  model_evaluation:
    cmd: python src/components/model_evaluation.py
    deps:
    - artifacts/model_trainer/lgbm_model.pkl
    - artifacts/model_trainer/tfidf_vectorizer.pkl
    - artifacts/data_preprocessing/train_processed.csv
    - artifacts/data_preprocessing/test_processed.csv
    - src/components/model_evaluation.py
    outs:
    - experiment_info.json