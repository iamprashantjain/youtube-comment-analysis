name: CI CD Pipeline

on:
  push:

jobs:
  project-ci-cd:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REGISTRY: 739275446561.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
      ECR_REPO: prashant-mlops-ecr
      IMAGE_NAME: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:latest
      S3_BUCKET: prashant-mlops-bucket

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements_dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements_dev.txt
        pip install dvc[s3] dagshub pytest

    - name: Pull data from DVC remote (S3)
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
      run: |
        dvc pull --force
        ls artifacts/data_ingestion/

    - name: Install NLTK data
      run: |
        python -m nltk.downloader punkt stopwords wordnet

    - name: Run DVC pipeline
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
      run: dvc repro -v

    - name: Push DVC-tracked data to remote
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: dvc push

    - name: Configure Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Commit changes (if any)
      if: ${{ github.actor != 'github-actions[bot]' }}
      run: |
        git add .
        git commit -m "Automated commit of DVC outputs and updated code" || echo "No changes to commit"
        git push origin ${{ github.ref_name }}

    - name: Run tests
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
      run: |
        pytest tests/test_model_loading.py
        pytest tests/test_model_signature.py
        pytest tests/test_model_performance.py

    - name: Promote model to production
      if: success()
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
      run: python src/components/promote_model.py

    - name: Start Flask app (test run)
      run: |
        nohup python flask_app/app.py > flask.log 2>&1 &
        echo "Started Flask app in background"
        sleep 5
        curl --retry 5 --retry-connrefused --retry-delay 2 http://127.0.0.1:5000/ || (cat flask.log && exit 1)

    - name: Run Flask API tests
      run: pytest tests/test_flask_api.py

    # ---- Docker + ECR ----
    - name: Login to AWS ECR
      run: |
        aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
          docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

    - name: Build Docker image
      run: docker build -t ${{ env.ECR_REPO }} .

    - name: Tag Docker image
      run: docker tag ${{ env.ECR_REPO }}:latest ${{ env.IMAGE_NAME }}

    - name: Push Docker image to AWS ECR
      run: docker push ${{ env.IMAGE_NAME }}

    # ---- Deployment ----
    - name: Zip files for deployment
      run: |
        zip -r deployment.zip appspec.yml deploy/scripts/install_dependencies.sh deploy/scripts/start_docker.sh

    - name: Upload ZIP to S3
      run: aws s3 cp deployment.zip s3://prashant-mlops-bucket/deployment.zip

    - name: Deploy to AWS CodeDeploy
      run: |
        aws deploy create-deployment \
          --application-name YTChromePlugin \
          --deployment-config-name CodeDeployDefault.AllAtOnce \
          --deployment-group-name YTChromePluginDeploymentGroup \
          --s3-location bucket=prashant-mlops-bucket,key=deployment.zip,bundleType=zip \
          --file-exists-behavior OVERWRITE \
          --region ${{ env.AWS_REGION }}
