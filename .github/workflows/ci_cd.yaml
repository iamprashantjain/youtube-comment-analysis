name: CI CD Pipeline

on:
  push:

jobs:
  project-ci-cd:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements_dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements_dev.txt

    - name: Install DVC and Dagshub
      run: pip install dvc[s3] dagshub

    - name: Pull data from DVC remote (S3)
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
      run: |
        dvc pull --force
        ls artifacts/data_ingestion/

    - name: Install NLTK data
      run: |
        python -m nltk.downloader punkt stopwords wordnet

    - name: Run DVC pipeline
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
      run: dvc repro -v

    - name: Push DVC-tracked data to remote
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      run: |
        dvc push

    - name: Configure Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Add changes to Git
      run: |
        git add .

    - name: Commit changes
      if: ${{ github.actor != 'github-actions[bot]' }}
      run: |
        git commit -m "Automated commit of DVC outputs and updated code" || echo "No changes to commit"

    - name: Push changes
      if: ${{ github.actor != 'github-actions[bot]' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git push origin ${{ github.ref_name }}

    - name: Install test dependencies
      run: |
        pip install pytest

    - name: Run model loading test
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
      run: |
        pytest tests/test_model_loading.py

    - name: Run model signature test
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
      run: |
        pytest tests/test_model_signature.py

    - name: Run model performance test
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
      run: |
        pytest tests/test_model_performance.py

    - name: Promote model to production
      if: success()
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
      run: python src/components/promote_model.py

    - name: Start flask app
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
      run: |
        nohup python flask_app/app.py > flask.log 2>&1 &
        echo "Started Flask app in background"
        sleep 5
        curl --retry 5 --retry-connrefused --retry-delay 2 http://127.0.0.1:5000/ || (cat flask.log && exit 1)

    - name: Run flask api test
      run: |
        pytest tests/test_flask_api.py
    

    - name: Login to AWS ECR
      if: success()
      run: |
        aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 739275446561.dkr.ecr.ap-south-1.amazonaws.com

    
    - name: Build Docker image
      if: success()
      run: |
        docker build -t prashant-mlops-ecr .

    
    - name: Tag Docker image
      if: success()
      run: |
        docker tag prashant-mlops-ecr:latest 739275446561.dkr.ecr.ap-south-1.amazonaws.com/prashant-mlops-ecr:latest

    
    - name: Push Docker image to AWS ECR
      if: success()
      run: |
        docker push 739275446561.dkr.ecr.ap-south-1.amazonaws.com/prashant-mlops-ecr:latest